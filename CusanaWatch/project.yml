# Regenerate the Xcode project with:  xcodegen generate
#
# The .xcodeproj IS committed so the client's next developer can clone and hit
# Run without installing tooling. This file is the source of truth — edit here,
# not in Xcode's build settings inspector, or the next generate wipes it.

name: CusanaWatch
options:
  bundleIdPrefix: xyz.sleywil
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  CusanaKit:
    path: CusanaKit

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    # Swift 6 language mode, strict concurrency on. The state machine is
    # @MainActor-isolated and the API client is Sendable, so this is enforced
    # rather than aspirational.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULE_DEBUGGING: false

targets:
  CusanaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
    dependencies:
      - package: CusanaKit
        product: CusanaKit
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.sleywil.cusanawatch
        PRODUCT_NAME: Cusana
        INFOPLIST_FILE: WatchApp/Info.plist
        # We supply our own plist because it carries the three custom Cusana
        # keys; the generated one cannot express those.
        GENERATE_INFOPLIST_FILE: false
        # Reads CUSANA_DEVELOPMENT_TEAM from Config/Secrets.xcconfig. Empty is
        # correct for the simulator; a real watch needs it set.
        DEVELOPMENT_TEAM: $(CUSANA_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
